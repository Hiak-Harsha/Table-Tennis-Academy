name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee test-output.txt
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test?schema=public'
          SESSION_SECRET: 'test-secret-at-least-32-characters-long-for-testing'
          NODE_ENV: 'test'

      - name: Report failure as commit comment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = 'No log file generated';
            if (fs.existsSync('test-output.txt')) {
              log = fs.readFileSync('test-output.txt', 'utf8').slice(-3000);
            }
            try {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: '### CI Test Failure Log\n```\n' + log + '\n```'
              });
            } catch (e) {
              console.log('Error creating comment:', e);
            }

      - name: Build Application
        run: npm run build
        env:
          DATABASE_URL: 'postgresql://test:test@localhost:5432/test?schema=public'
          SESSION_SECRET: 'test-secret-at-least-32-characters-long-for-testing'
          NODE_ENV: 'test'
